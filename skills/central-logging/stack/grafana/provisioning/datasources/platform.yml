# Platform org (id 1): health data of the logging stack itself, tenant "platform".
# Project orgs get their own file from scripts/logctl.py add-project.
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    orgId: 1
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: platform
