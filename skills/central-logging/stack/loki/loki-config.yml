# Generic Loki config: no project, server or application names belong here.
# Tenants (= projects) come from the X-Scope-OrgID header the gateway sets.
auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h            # 7 days, pilot
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 168h
  ingestion_rate_mb: 4              # per tenant
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 6MB
  max_line_size: 256KB
  max_line_size_truncate: true
  max_label_names_per_series: 15
  max_global_streams_per_user: 5000
  allow_structured_metadata: true
  volume_enabled: true
  discover_service_name: []        # we set "service" ourselves; no auto service_name label

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
