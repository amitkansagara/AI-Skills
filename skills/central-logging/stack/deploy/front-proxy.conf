# Front proxy vhosts for the central logging stack (TLS ends here).
# Replace LOGS_HOST, INGEST_HOST and UPSTREAM (= BIND_ADDR:BIND_PORT of the logging host),
# then: certbot --nginx -d LOGS_HOST -d INGEST_HOST
# The gateway behind allows only this proxy's LAN address (ALLOW_FROM in .env).

server {
    listen 80;
    server_name LOGS_HOST INGEST_HOST;
    location / { return 301 https://$host$request_uri; }
}

# Grafana (developers)
server {
    listen 443 ssl;
    http2 on;
    server_name LOGS_HOST;
    # ssl_certificate / ssl_certificate_key: added by certbot

    client_max_body_size 10m;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_pass http://UPSTREAM;
    }
}

# Log push (Alloy). Only the push path exists.
server {
    listen 443 ssl;
    http2 on;
    server_name INGEST_HOST;
    # ssl_certificate / ssl_certificate_key: added by certbot

    client_max_body_size 10m;
    location = /loki/api/v1/push {
        proxy_set_header Host $host;
        proxy_pass http://UPSTREAM;
    }
    location / { return 404; }
}
