# Central logging stack: Loki + Grafana behind one nginx gateway.
# Isolated compose project: own network and volumes, nothing shared with other stacks.
name: central-logging

x-logging: &container-logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  loki:
    image: grafana/loki:${LOKI_TAG}
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    logging: *container-logs
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "${LOKI_MEM:-1g}" }
    # No published port: only the gateway and Grafana reach Loki.

  grafana:
    image: grafana/grafana:${GRAFANA_TAG}
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL}
      GF_SECURITY_COOKIE_SECURE: ${GF_COOKIE_SECURE:-true}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      # New users land in the Platform org with no role: they see nothing until an
      # admin adds them to a project org.
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ID: "1"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "None"
      # Lets Viewers use Explore / live tail. Access is bounded by the org's tenant, not by the role.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana-dashboards:ro
    # Localhost only, for the admin scripts. Login is still required.
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3000}:3000"
    restart: unless-stopped
    logging: *container-logs
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "${GRAFANA_MEM:-768m}" }

  gateway:
    image: nginx:${NGINX_TAG}
    environment:
      GRAFANA_HOST: ${GRAFANA_HOST}
      INGEST_HOST: ${INGEST_HOST}
      ALLOW_FROM: ${ALLOW_FROM}
      BIND_ADDR: ${BIND_ADDR}
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./secrets:/etc/nginx/auth:ro
    ports:
      - "${BIND_ADDR}:${BIND_PORT}:8080"
    depends_on: [loki, grafana]
    restart: unless-stopped
    logging: *container-logs
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64m }

volumes:
  loki-data:
  grafana-data:
